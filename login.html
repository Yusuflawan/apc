<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#f6f7f1">
	<title>Login | PBAT</title>
	<link rel="stylesheet" href="assets/css/bootstrap.min.css">
	<link rel="stylesheet" href="assets/css/style.css">
	<style>
		:root {
			color-scheme: light;
			--page: #f6f7f1;
			--ink: #202820;
			--muted: #6d766c;
			--line: #dce2d7;
			--accent: #c9a82a;
			--accent-dark: #927613;
			--surface: #fff;
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			background: var(--page);
			color: var(--ink);
			font-family: "Nunito Sans", "Segoe UI", sans-serif;
		}

		.register-shell {
			display: grid;
			min-height: 100vh;
			place-items: center;
			padding: 36px 20px;
			background-image: linear-gradient(135deg, rgba(201, 168, 42, .07) 0, transparent 42%);
		}

		.register-panel {
			width: min(100%, 440px);
			padding: 34px 38px 30px;
			background: var(--surface);
			border: 1px solid #e8ebe4;
			border-radius: 8px;
			box-shadow: 0 18px 48px rgba(32, 40, 32, .08);
			animation: arrive .45s ease-out both;
		}

		.brand-mark {
			display: block;
			width: 100px;
			height: 100px;
			margin: 0 auto 20px;
			object-fit: contain;
		}

		.register-heading { margin-bottom: 26px; text-align: center; }
		.register-heading h1 { margin: 0 0 9px; color: var(--ink); font-size: 27px; line-height: 1.2; }
		.register-heading p { margin: 0; color: var(--muted); font-size: 14px; }
		.stepper { display: grid; grid-template-columns: repeat(3, 1fr); margin: 0 0 26px; }
		.step-indicator { position: relative; color: #92998e; font-size: 12px; text-align: center; }
		.step-indicator::before { position: absolute; z-index: 0; top: 14px; right: 50%; width: 100%; height: 1px; background: var(--line); content: ""; }
		.step-indicator:first-child::before { display: none; }
		.step-number { position: relative; z-index: 1; display: grid; width: 29px; height: 29px; margin: 0 auto 7px; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--muted); font-size: 12px; font-weight: 700; }
		.step-indicator[aria-current="step"] { color: var(--ink); font-weight: 700; }
		.step-indicator[aria-current="step"] .step-number,
		.step-indicator.is-complete .step-number { border-color: var(--accent); background: var(--accent); color: var(--ink); }
		.form-step[hidden] { display: none; }
		.step-title { margin: 0 0 17px; color: var(--ink); font-size: 16px; font-weight: 800; }
		.form-navigation { display: flex; gap: 10px; margin-top: 5px; }
		.form-navigation .submit-button { margin-top: 0; }
		.back-button { min-width: 90px; min-height: 47px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); font: inherit; font-weight: 700; cursor: pointer; }
		.back-button:hover { background: #f7f8f4; }
		.back-button[hidden] { display: none; }

		.field { margin-bottom: 17px; }
		.field label { display: block; margin-bottom: 7px; color: var(--ink); font-size: 13px; font-weight: 700; }
		.field input, .field select {
			display: block;
			width: 100%;
			height: 46px;
			padding: 0 13px;
			border: 1px solid var(--line);
			border-radius: 4px;
			background: #fff;
			color: var(--ink);
			font: inherit;
			transition: border-color .16s ease, box-shadow .16s ease;
		}
		.field input:focus, .field select:focus {
			border-color: var(--accent-dark);
			outline: 0;
			box-shadow: 0 0 0 3px rgba(201, 168, 42, .16);
		}

		.submit-button {
			width: 100%;
			min-height: 47px;
			margin-top: 5px;
			border: 0;
			border-radius: 4px;
			background: var(--accent);
			color: #202015;
			font: inherit;
			font-size: 15px;
			font-weight: 800;
			cursor: pointer;
			transition: background .16s ease, transform .16s ease;
		}
		.submit-button:hover { background: #d6b632; }
		.submit-button:active { transform: translateY(1px); }
		.submit-button:disabled { cursor: wait; opacity: .7; }

		.form-message { min-height: 20px; margin: 15px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
		.form-message[data-state="error"] { color: #a52e28; }
		.form-message[data-state="success"] { color: #287044; }

		.register-footer { margin: 18px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
		.register-footer a { color: var(--accent-dark); font-weight: 700; }

		@keyframes arrive {
			from { opacity: 0; transform: translateY(10px); }
			to { opacity: 1; transform: translateY(0); }
		}

		@media (max-width: 480px) {
			.register-panel { padding: 28px 22px 24px; }
			.brand-mark { width: 86px; height: 86px; }
		}

		@media (prefers-reduced-motion: reduce) {
			*, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
		}
	</style>
</head>
<body>
	<main class="register-shell">
		<section class="register-panel" aria-labelledby="register-title">
			<img class="brand-mark" src="assets/images/logo/logo-form.PNG" alt="PBAT logo">
			<header class="register-heading">
				<h1 id="register-title">Login</h1>
				<p>Login to your account</p>
			</header>

			<form style="margin-top: -7rem;" id="login-form" novalidate>
				<section class="form-step" data-step="0" aria-labelledby="personal-step-title" style="margin-bottom: -5rem;">
                    <div class="field">
                        <label for="email">Email address</label>
                        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
                    </div>
				</section>

				<button class="submit-button" id="login-btn" type="submit">
                    <span class="btn-text">Login</span>
                    <span class="spinner-border spinner-border-sm d-none ms-2" role="status" aria-hidden="true"></span>
                </button>

				<p id="form-message" class="form-message" role="status" aria-live="polite"></p>
			</form>

			<p class="register-footer"><a href="index.html">Return to home</a></p>
		</section>
	</main>

    <script src="assets/js/my-js/login.js"></script>
</body>
</html>
